version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ordering-service:
    build:
      context: .
      dockerfile: ordering.dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - DEBUG=${DEBUG}
      - ORDER_SERVICE_HOST=127.0.0.1
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

  worker-service:
    build:
      context: .
      dockerfile: worker.dockerfile
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - DEBUG=${DEBUG}
      - WORKER_SERVICE_HOST=127.0.0.1
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

volumes:
  redis_data: